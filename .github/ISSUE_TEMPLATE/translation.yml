name: Translation
description: Report a wrong or missing translation, or offer a new language.
labels: [translation]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, German, Spanish, French, Other (new language)]
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Current text and suggested text
      description: Where it appears in the app, what it says now, and what it should say.
    validations:
      required: true
