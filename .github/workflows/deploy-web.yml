name: Deploy Flutter Web to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: "3.47.7"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Compile Drift web worker
        # web/drift_worker.dart is committed source; the compiled JS is gitignored
        # and must be generated here so flutter build web picks it up from web/.
        run: dart compile js web/drift_worker.dart -o web/drift_worker.dart.js

      - name: Build web
        run: |
          flutter build web --release \
            --base-href /silvertimer_flutter/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          # Keep the CNAME file if a custom domain is configured later
          keep_files: false

