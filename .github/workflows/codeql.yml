name: CodeQL Analysis

on:
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly scan every Monday at 08:00 UTC — backstop for the rare direct
    # push that doesn't go through a PR.
    - cron: '0 8 * * 1'

concurrency:
  # Cancel a stale scan when the PR gets a new push before the old one
  # finishes — only the latest commit's result matters.
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: "3.47.7"

jobs:
  analyze-swift:
    name: Analyze Swift (iOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 'latest-stable'

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual

      - name: Generate Flutter iOS artifacts
        # flutter build ios generates the Flutter engine framework,
        # GeneratedPluginRegistrant.swift, and SPM-resolved packages that
        # xcodebuild needs. CodeQL cannot trace Swift through Flutter's
        # build wrapper, so we run a second xcodebuild directly below.
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build ios --no-codesign

      - name: Build Swift for CodeQL tracing
        # A fresh derivedDataPath forces xcodebuild to recompile all Swift
        # sources so CodeQL can intercept every swiftc invocation.
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath /tmp/codeql-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: swift

  analyze-android:
    name: Analyze Android (Kotlin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Android
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: java-kotlin
