name: silvertimer_flutter
description: "Colloidal silver electrolysis timer calculator"
publish_to: 'none'

version: 2.4.1+45

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.1.1

  # Data Freezing & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local Storage - History
  drift: ^2.35.3
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0

  # Local Storage - Settings
  shared_preferences: ^2.5.6

  # Notifications & alarm sound
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  audioplayers: ^6.1.0

  # Platform detection
  universal_platform: ^1.1.0

  # Internationalization (date formatting)
  intl: ^0.20.2

  # UI
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3

  # Info screen
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  mockito: ^5.8.1
  sqlite3: ^3.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/
    - assets/images/
